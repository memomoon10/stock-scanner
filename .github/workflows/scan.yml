name: Finnhub Scanner

on:
  schedule:
    # يشتغل كل ساعة (بتوقيت UTC). عدّل الرقم لو تبيه أسرع/أبطأ.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # يسمح لك تشغّله يدويًا من تبويب Actions بالمستودع

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner (price-only pass, fast — no Beta each hour)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python finnhub_price_scanner.py \
            --skip-beta \
            --output matches_under_price.csv \
            --json-output public/results.json

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
