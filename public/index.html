<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Smart Scalper — أسهم تحت 5$</title>
<style>
  :root {
    --bg: #0A0D13; --panel: #12161F; --panel2: #171C27; --line: #232A38;
    --text: #E7EAF0; --muted: #7C8797; --green: #12D6A6; --red: #FF5D6C; --amber: #F2B33D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; direction: rtl;
  }
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  #gate input {
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); font-size: 15px; width: 220px; text-align: center;
  }
  #gate button {
    padding: 10px 22px; border-radius: 8px; border: none; background: var(--green);
    color: #06110D; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  #gate .err { color: var(--red); font-size: 13px; min-height: 16px; }
  #app { display: none; padding: 16px; max-width: 1100px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 18px; margin: 0; }
  #meta { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: right; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { background: var(--panel2); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  tr:hover td { background: var(--panel2); }
  .num { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--green); } .down { color: var(--red); }
  #refresh { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .loading, .empty { color: var(--muted); text-align: center; padding: 30px; }
</style>
</head>
<body>

<div id="gate">
  <div style="font-weight:700; font-size:18px;">🔒 AI Smart Scalper</div>
  <input id="pw" type="password" placeholder="كلمة المرور" />
  <button onclick="tryLogin()">دخول</button>
  <div class="err" id="err"></div>
</div>

<div id="app">
  <header>
    <h1>الأسهم الأمريكية تحت 5$ — بيانات حقيقية من Finnhub</h1>
    <div>
      <span id="meta"></span>
      <button id="refresh" onclick="load()">تحديث الآن</button>
    </div>
  </header>
  <div id="content" class="loading">...جاري التحميل</div>
</div>

<script>
  // ⚠️ حماية بسيطة لمشاركة الرابط مع أشخاص موثوقين فقط — مو تشفير حقيقي.
  // غيّر هذي الكلمة قبل ما تنشر الموقع.
  const SITE_PASSWORD = "memo6806";

  function tryLogin() {
    const val = document.getElementById('pw').value;
    if (val === SITE_PASSWORD) {
      sessionStorage.setItem('authed', '1');
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      load();
    } else {
      document.getElementById('err').textContent = 'كلمة المرور غير صحيحة';
    }
  }

  if (sessionStorage.getItem('authed') === '1') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    load();
  }

  async function load() {
    const content = document.getElementById('content');
    content.className = 'loading';
    content.textContent = '...جاري التحميل';
    try {
      const res = await fetch('results.json?t=' + Date.now());
      const data = await res.json();
      renderTable(data);
    } catch (e) {
      content.className = 'empty';
      content.textContent = 'تعذّر تحميل البيانات — تأكد إن السكربت اشتغل مرة على الأقل.';
    }
  }

  function renderTable(data) {
    const content = document.getElementById('content');
    const meta = document.getElementById('meta');
    const updated = new Date(data.updated_at);
    meta.textContent = `آخر تحديث: ${updated.toLocaleString('ar-SA')} · ${data.count} سهم`;

    if (!data.stocks || data.stocks.length === 0) {
      content.className = 'empty';
      content.textContent = 'ما فيه أسهم مطابقة حاليًا.';
      return;
    }

    let html = '<table><thead><tr>' +
      '<th>Ticker</th><th>الشركة</th><th>السعر</th><th>%التغير</th><th>Beta</th><th>السوق</th>' +
      '</tr></thead><tbody>';

    data.stocks.forEach(s => {
      const chg = s.change_pct;
      const chgClass = chg >= 0 ? 'up' : 'down';
      const chgSign = chg >= 0 ? '+' : '';
      html += `<tr>
        <td class="num" style="font-weight:700">${s.symbol}</td>
        <td>${s.name || ''}</td>
        <td class="num">$${Number(s.price).toFixed(2)}</td>
        <td class="num ${chgClass}">${chg != null ? chgSign + chg.toFixed(1) + '%' : '—'}</td>
        <td class="num">${s.beta != null ? s.beta.toFixed(2) : '—'}</td>
        <td>${s.mic || ''}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    content.className = '';
    content.innerHTML = html;
  }
</script>
</body>
</html>
